# Allowlist proxy: the codebench sandbox's ONLY route to an LLM. Confirmed via
# services/agent/app/llm_backends.py that the runtime client is a plain AsyncOpenAI SDK
# instance calling client.chat.completions.create(...), which POSTs to exactly
# {base_url}/chat/completions — nothing else is ever needed.
#
# Why this exists: joining badmodel-ollama directly to codebench_sandbox (the original
# design) gave the sandbox unrestricted, UNAUTHENTICATED access to Ollama's entire admin
# API on the same TCP connection — verified live: GET /api/tags enumerates the shared
# instance's full model roster, DELETE /api/delete actually processes deletion requests
# (404 for an unknown name, not 401/403 — i.e. no auth at all), and POST /api/pull makes
# Ollama's OWN internet-connected registry client fetch whatever tag is requested. A
# malicious or merely confused agent could DoS or corrupt this SHARED, already-running
# instance that other sessions/work depend on. This proxy is the fix: it sits between the
# sandbox and Ollama, forwards only POST /v1/chat/completions, and returns 403 for
# literally everything else — including every other OpenAI-compatible path (e.g.
# /v1/models), on purpose, since nothing in this codebase's runtime path needs them.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 64; }

http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  # Unused (no fastcgi/uwsgi/scgi anywhere in this config) but nginx creates these temp
  # dirs unconditionally at startup regardless — redirect off the read-only rootfs too.
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Docker's embedded DNS (127.0.0.11) — resolved per-request via the $upstream variable,
  # not once at config-load time, so this survives badmodel-ollama being restarted/
  # recreated with a new IP without needing the proxy itself restarted.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 8090;

    location = /v1/chat/completions {
      limit_except POST { deny all; }
      set $upstream "badmodel-ollama";
      proxy_pass http://$upstream:11434/v1/chat/completions;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location / {
      return 403 "codebench-ollama-proxy: only POST /v1/chat/completions is allowed\n";
    }
  }
}
