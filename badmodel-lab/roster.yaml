# Bad-model lab roster. Subjects are the "super bad" models we are trying to make
# agentic; anchors are known-good references we run on the easy tiers to set the
# ceiling for the merged recovery curve.
#
# All subjects fit the RTX 3060 (12 GB) one at a time — ollama swaps on demand
# (OLLAMA_MAX_LOADED_MODELS=1). Sizes are the Q4_K_M download, approximate.
# Tags are validated by `ollama pull`; adjust if a tag 404s.

subjects:                         # place: local (free) via badmodel-ollama :11435
  - tag: tinyllama                # ~0.6 GB (1.1B)  — the floor; genuinely terrible at structure
  - tag: qwen2.5:0.5b             # ~0.4 GB         — super bad; cannot reliably emit JSON
  - tag: llama3.2:1b              # ~1.3 GB
  - tag: qwen2.5:1.5b             # ~1.0 GB
  - tag: gemma2:2b                # ~1.6 GB
  - tag: llama3.2:3b              # ~2.0 GB         — the "getting decent" edge
  - tag: phi3:mini               # ~2.3 GB (3.8B)  — reasoning-capable edge case
  - tag: qwen2.5:14b              # ~9.0 GB, ~10.9/12.3 GB VRAM at ctx=16384 -- little headroom
                                   # left on this card. Added 2026-08-04 (Round 3); already pulled
                                   # ad hoc from the 2026-07-28 overnight session.

anchors:                          # ceiling references — run on micro/reachable tiers only
  - tag: qwen2.5:7b               # local, already pulled in yappers-ollama (:11434) — free
  - tag: openai/gpt-4.1-nano      # OpenRouter — the existing cheap-but-capable baseline ($, tiny)
  # - tag: openai/gpt-5-mini      # OpenRouter — premium-ish anchor; only if budget allows

# Task tiers (IDs resolved in tiers.yaml). Bad models get signal on micro/reachable;
# hard tier is expected to floor and is only for the anchors + the merge.
