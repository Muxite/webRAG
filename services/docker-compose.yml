name: "euglena"
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The six default-profile services carry restart: unless-stopped (STANDARDS
    # rule 2). Without it they survived a reboot only because webrag.service
    # re-ran `compose up`; a dockerd restart or crash left the stack down and the
    # Tailscale funnel pointing at a dead :18080. The test/cli/debug profiles
    # below stay restart-less — rule 2 exempts one-shot containers.
    restart: unless-stopped
    networks:
      - enet

#  inference:
#    image: ghcr.io/ggml-org/llama.cpp:server-cuda
#    volumes:
#      - ./inference/models:/models
#    environment:
#      - LLAMA_ARG_MODEL=/models/Phi-3-mini-4k-instruct-q4.gguf
#      - LLAMA_ARG_N_GPU_LAYERS=999
#      - LLAMA_ARG_PORT=8000
#      - LLAMA_ARG_HOST=0.0.0.0
#      - LLAMA_API=true
#    ports:
#      - "8000:8000"
#    entrypoint: ["/app/llama-server"]
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]
#    networks:
#      - enet

  chroma:
    image: chromadb/chroma:latest
    container_name: euglena-chroma
    ports:
      - "8001:8000"
    volumes:
      - ./chroma:/chroma-cache_retrieved
      - chroma_cache:/root/.cache
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma-data
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"',
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s
    restart: unless-stopped
    networks:
      - enet

  agent:
    build:
      context: ..
      dockerfile: agent/.dockerfile
    depends_on:
      chroma:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.main"]
    env_file:
      - .env
      - keys.env
    environment:
      - AGENT_STATUS_TIME=0.6
    restart: unless-stopped
    networks:
      - enet

  agent-cli:
    profiles: ["cli"]
    build:
      context: ..
      dockerfile: agent/.dockerfile
    stdin_open: true
    tty: true
    depends_on:
      - chroma
      - redis
      - rabbitmq
    command: ["python", "-m", "app.basic_cli"]
    env_file:
      - .env
      - keys.env
    networks:
      - enet

  # ---------------------------------------------------------------------------
  # promptbench -- offline prompt-shape / calibration micro-eval.
  #
  #   docker compose --profile promptbench run --rm promptbench --census
  #   docker compose --profile promptbench run --rm promptbench \
  #       --models qwen2.5:0.5b qwen2.5:7b --families verify calibration \
  #       --variants A0 A1 A2 --out agent/idea_test_results/promptbench_runs.jsonl
  #   docker compose --profile promptbench run --rm promptbench-analyze \
  #       --runs agent/idea_test_results/promptbench_runs.jsonl
  #
  # Its own profile, so neither service starts with the default stack. Both are
  # one-shot and therefore carry no `restart:` (rule 2 exempts one-shot containers).
  #
  # SOURCE IS MOUNTED, NOT BAKED. agent/.dockerfile COPYs the agent in at build
  # time, and DEV_CYCLE.md lesson 4 records a codebench reverification that
  # silently tested PRE-FIX code because its image predated the fix and nothing
  # stamps an image with the SHA it was built from. A read-only mount makes that
  # class of bug impossible here rather than merely detectable.
  #
  # No GPU reservation: inference belongs to badmodel-ollama, which holds
  # OLLAMA_MAX_LOADED_MODELS=1 on a 12 GB card. Reserving here would contend with it.
  # badmodel-ollama joins this file's `enet` as external `euglena_enet`, so it is
  # reachable by service name. On the host the default stays :11435 and nothing
  # about the documented host workflow changes.
  promptbench:
    profiles: ["promptbench"]
    build:
      context: ..
      dockerfile: agent/.dockerfile
    working_dir: /app
    entrypoint: ["python", "-m", "agent.app.promptbench.runner"]
    # Write JSONL as the host user, not root. Without this the results file lands
    # root-owned on the host and the next HOST-side run cannot append to it -- the
    # host and container workflows are meant to share one resumable output file.
    user: "${PROMPTBENCH_UID:-1000}:${PROMPTBENCH_GID:-1000}"
    volumes:
      - ../agent:/app/agent:ro
      - ../scripts:/app/scripts:ro
      # Nested read-write mount so JSONL rows land on the HOST and the existing
      # host-side analysis keeps working on them unchanged.
      - ../agent/idea_test_results:/app/agent/idea_test_results:rw
    environment:
      - PYTHONPATH=/app
      - PROMPTBENCH_BASE_URL=http://badmodel-ollama:11434/v1
      - PROMPTBENCH_API_KEY=ollama
    env_file:
      - .env
      - keys.env
    networks:
      - enet

  promptbench-analyze:
    profiles: ["promptbench"]
    build:
      context: ..
      dockerfile: agent/.dockerfile
    working_dir: /app
    entrypoint: ["python", "-m", "agent.app.promptbench.analyze"]
    user: "${PROMPTBENCH_UID:-1000}:${PROMPTBENCH_GID:-1000}"
    volumes:
      - ../agent:/app/agent:ro
      - ../scripts:/app/scripts:ro
      - ../agent/idea_test_results:/app/agent/idea_test_results:rw
    environment:
      - PYTHONPATH=/app
    networks:
      - enet

  # Offline unit/regression suite (the ~5.8k-test pytest run), host-equivalent of
  #   PYTHONPATH=.:services:agent ./.venv/bin/python -m pytest agent/tests/ -q
  #
  #   docker compose --profile test run --rm agent-test              # whole suite
  #   docker compose --profile test run --rm agent-test pytest -q tests/got_operations_test.py
  #
  # TESTS ARE MOUNTED, NOT BAKED, and that is forced rather than chosen: the root
  # .dockerignore excludes agent/tests/ (and scripts/, services/keys.env) from the build
  # context so the ~10 GB runtime image carries no non-runtime files -- `pytest tests`
  # in the baked image collected zero tests. Mounting also removes the stale-image
  # failure mode DEV_CYCLE.md lesson 4 records.
  #
  # working_dir is /app (repo root), NOT the image's /app/agent: a dozen test modules
  # open repo-relative paths (`services/docker-compose.yml`, `agent/app/idea_dag_settings.json`,
  # `agent/tests/fixtures/...`) and 10 more import scripts/ via parents[2]. PYTHONPATH
  # mirrors the canonical host invocation's `.:services:agent`, which also means `shared.*`
  # resolves to the MOUNTED source rather than the copy pip-installed at build time.
  # ---------------------------------------------------------------------------
  # ladder-benchmark -- the compute-ladder A/B driver (scripts/adaptive_ladder_run.py)
  # pointed at the LOCAL Ollama models, i.e. the $0 benchmark path.
  #
  #   docker compose --profile ladder-benchmark run --rm ladder-benchmark
  #       ^ default: dry-run cell plan for one task on the local axis. No LLM calls,
  #         no network, no spend -- a wiring smoke test.
  #
  #   # real local run (overriding the default args; entrypoint is preserved):
  #   docker compose --profile ladder-benchmark run --rm ladder-benchmark \
  #       --run-id ladder_local --axis capspec_local --task-set smoke8 \
  #       --arms baseline,good_adaptive --jobs 1
  #   # paid-API arm (keys come from keys.env via env_file, same as every other service):
  #   docker compose --profile ladder-benchmark run --rm ladder-benchmark \
  #       --run-id ladder_api --model openai/gpt-4.1-nano --no-ref --reps 2 --budget 3
  #
  # Same shape as the promptbench block above and for the same reasons: source is
  # mounted read-only rather than trusted from the image (DEV_CYCLE.md lesson 4), the
  # process runs as the host user so results/ledgers/locks are not root-owned, and no
  # GPU is reserved because inference belongs to badmodel-ollama (one loaded model,
  # 12 GB card) -- reserving here would contend with the thing doing the work.
  #
  # LOCAL_API_URL rewrites the axis table's hard-coded http://localhost:11435/v1 (the
  # HOST publication of badmodel-ollama) to the service name on the shared network, so
  # the same axis definitions serve both the host and container workflows.
  #
  # --chroma-mode stays at the script's `embedded` default rather than pointing at the
  # `chroma` service: every cell gets its own SQLite file under the results mount, which
  # is what keeps parallel cells (and a concurrent host run) from contending on one
  # server, and it keeps a benchmark from writing into the LIVE stack's chroma.
  ladder-benchmark:
    profiles: ["ladder-benchmark"]
    build:
      context: ..
      dockerfile: agent/.dockerfile
    working_dir: /app
    entrypoint: ["python", "scripts/adaptive_ladder_run.py"]
    command: ["--run-id", "ladder_smoke", "--axis", "capspec_local", "--tasks", "122",
              "--arms", "baseline,good_adaptive", "--dry-run"]
    user: "${LADDER_UID:-1000}:${LADDER_GID:-1000}"
    volumes:
      - ../agent:/app/agent:ro
      - ../scripts:/app/scripts:ro
      # Nested read-write mount: result JSON, per-cell logs, the attempt ledger and the
      # embedded per-cell chroma dirs all live under here, and a resumed HOST-side run
      # must be able to read and extend them.
      - ../agent/idea_test_results:/app/agent/idea_test_results:rw
    environment:
      - PYTHONPATH=/app:/app/agent
      # The driver hard-codes a host repo path and a .venv interpreter; both are
      # env-overridable so it runs unchanged here (repo at /app, system python).
      - WEBRAG_REPO=/app
      - WEBRAG_PYTHON=python
      - LOCAL_API_URL=http://badmodel-ollama:11434/v1
      # Running as a uid with no /etc/passwd entry leaves HOME unset, and chroma resolves
      # its ONNX embedding cache under Path.home(). Naming /root explicitly (readable since
      # the dockerfile's `chmod 755 /root`) reuses the baked model instead of re-downloading
      # 79 MB per cell.
      - HOME=/root
    env_file:
      - .env
      - keys.env
    networks:
      - enet

  agent-test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: agent/.dockerfile
    depends_on:
      - chroma
      - redis
      - rabbitmq
    working_dir: /app
    command: ["pytest", "-q", "agent/tests"]
    # keys.env is deliberately NOT loaded here, and the three live-test switches .env
    # carries are forced off: this is the OFFLINE suite, matching the canonical host
    # invocation. With a real key in the environment the suite stops mocking and starts
    # POSTing to OpenRouter mid-run -- observed, not hypothetical -- which spends money
    # and makes a unit run network-flaky. The live smoke/preflight paths belong to the
    # idea-test/visit-test/general-test services below, which do load keys.env.
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/services:/app/agent
      - AGENT_STATUS_TIME=0.6
      - CONNECTOR_SMOKE_TESTS=false
      - LIVE_PREFLIGHT_TESTS=0
      - LIVE_PREFLIGHT_BROWSER_TESTS=0
    volumes:
      - ../agent/tests:/app/agent/tests:ro
      - ../agent/app:/app/agent/app:ro
      - ../scripts:/app/scripts:ro
      - ../services:/app/services:ro
      # codebench/ holds materialize_task.py, which the c25 task test drives end to end.
      - ../codebench:/app/codebench:ro
    networks:
      - enet

  idea-test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: agent/.dockerfile
    depends_on:
      - chroma
      - redis
      - rabbitmq
    command: ["python", "-m", "app.idea_test_runner"]
    env_file:
      - .env
      - keys.env
    environment:
      - AGENT_STATUS_TIME=0.6
      - IDEA_TEST_TOP_N=16
      - IDEA_TEST_MODELS=gpt-5-mini,gpt-5.2
      - IDEA_TEST_VALIDATION_MODEL=gpt-5-mini
      - IDEA_TEST_EXECUTION_VARIANTS=graph,sequential
      - IDEA_TEST_RUNS=1
      - IDEA_TEST_CONCURRENCY=4
      - IDEA_TEST_LOG_LEVEL=INFO
      - IDEA_TEST_MAX_STEPS=75
      - IDEA_TEST_REPORT_VERBOSITY=2
    volumes:
      - ../agent/idea_test_results:/app/agent/idea_test_results
      - ../agent/app/idea_tests:/app/agent/app/idea_tests
    networks:
      - enet

  visit-test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: agent/.dockerfile
    depends_on:
      - chroma
      - redis
      - rabbitmq
    command: ["python", "-m", "app.idea_test_runner"]
    env_file:
      - .env
      - keys.env
    environment:
      - AGENT_STATUS_TIME=0.6
      - MODEL_NAME=gpt-5-mini
      - IDEA_TEST_IDS=019,021
      - IDEA_TEST_EXECUTION_VARIANTS=graph
      - IDEA_TEST_RUNS=1
      - IDEA_TEST_CONCURRENCY=1
      - IDEA_TEST_REPORT_VERBOSITY=1
    volumes:
      - ../agent/idea_test_results:/app/agent/idea_test_results
      - ../agent/app/idea_tests:/app/agent/app/idea_tests
    networks:
      - enet

  general-test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: agent/.dockerfile
    depends_on:
      - chroma
      - redis
      - rabbitmq
    command: ["python", "-m", "app.idea_test_runner"]
    env_file:
      - .env
      - keys.env
    environment:
      - AGENT_STATUS_TIME=0.6
      - MODEL_NAME=gpt-5-mini
      - IDEA_TEST_IDS=002,012
      - IDEA_TEST_EXECUTION_VARIANTS=graph,sequential
      - IDEA_TEST_RUNS=1
      - IDEA_TEST_CONCURRENCY=1
      - IDEA_TEST_REPORT_VERBOSITY=1
    volumes:
      - ../agent/idea_test_results:/app/agent/idea_test_results
      - ../agent/app/idea_tests:/app/agent/app/idea_tests
    networks:
      - enet

  agent-debug:
    profiles: ["debug"]
    build:
      context: ..
      dockerfile: agent/.dockerfile
    depends_on:
      - chroma
      - redis
      - rabbitmq
    command: ["python", "-m", "app.debug_runner"]
    stdin_open: true
    tty: true
    env_file:
      - .env
      - keys.env
    environment:
      - MODEL_NAME=gpt-5-mini
      - INTERACTIVE_MAX_STEPS=100
      - INTERACTIVE_LOG_LEVEL=WARNING
    volumes:
      - ../agent/idea_test_results:/app/agent/idea_test_results
      - ../agent/app/idea_tests:/app/agent/app/idea_tests
    networks:
      - enet

  shared-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/.dockerfile
    depends_on:
      - rabbitmq
    command: ["pytest", "-v", "shared/tests"]
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    networks:
      - enet

  gateway-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: gateway/.dockerfile
    depends_on:
      - rabbitmq
      - redis
      - agent
    command: ["pytest", "-vv", "tests"]
    env_file:
      - .env
      - keys.env
    environment:
      - GATEWAY_TEST_MODE=1
    networks:
      - enet

  gateway:
    build:
      context: .
      dockerfile: gateway/.dockerfile
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_started
    command: ["python", "-m", "app.main"]
    env_file:
      - .env
      - keys.env
    restart: unless-stopped
    networks:
      - enet

  api-cli:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: apicli/.dockerfile
    stdin_open: true
    tty: true
    depends_on:
      - gateway
    command: [ "python", "-m", "app.apicli" ]
    env_file:
      - .env
      - keys.env
    networks:
      - enet

  connector-api:
    # Local-only reachability API: wraps the search/browser connectors so task
    # authors can pre-verify a query/URL is reachable before writing a task.
    # No host port mapping (container-network access only).
    build:
      context: .
      dockerfile: connector_api/.dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "13375"]
    env_file:
      - .env
      - keys.env
    restart: unless-stopped
    networks:
      - enet

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - enet

volumes:
  redis_data:
  chroma_cache:

networks:
  enet:
    driver: bridge
